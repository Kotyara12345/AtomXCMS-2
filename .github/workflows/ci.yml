name: Admin UI and security checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: atomx_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none

      - name: Lint changed PHP files
        run: |
          set -e
          for file in \
            admin/exit.php \
            admin/errors_log.php \
            admin/notifications.php \
            admin/inc/adm_boot.php \
            admin/server_config.php \
            admin/settings.php \
            admin/template/header.php \
            admin/template/footer.php \
            admin/security.php \
            admin/profile.php \
            admin/audit_log.php \
            admin/moderation.php \
            sys/inc/admin_security.lib.php \
            sys/inc/server_config.lib.php \
            sys/settings/languages/rus.php \
            install/do_queries.php \
            tests/admin-ui-test.php \
            tests/admin-security-integration-test.php
          do
            php -l "$file"
          done

      - name: Static admin UI and translation checks
        run: php tests/admin-ui-test.php

      - name: MySQL-backed admin security integration checks
        env:
          ATM_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=atomx_test;charset=utf8mb4'
          ATM_TEST_USER: root
          ATM_TEST_PASS: root
          ATM_TEST_REQUIRED: '1'
        run: php tests/admin-security-integration-test.php
