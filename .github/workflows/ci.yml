name: Admin UI and security checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: atomx_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, gd, exif
          coverage: none

      - name: Lint all PHP files
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Run all regression and MySQL integration checks
        env:
          ATM_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=atomx_test;charset=utf8mb4'
          ATM_TEST_USER: root
          ATM_TEST_PASS: root
          ATM_TEST_REQUIRED: '1'
        run: |
          set -e
          for test in tests/*-test.php; do php "$test"; done
